<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Fado tavern interior, the singer and guitarist mostly still, candle flames trembling">
<rect width="1200" height="340" fill="#14163c"/>
<g fill="none" stroke="#5c80a8" stroke-width="1.4" opacity="0.55">
<path d="M0,60 H1200 M0,120 H1200 M0,180 H1200"/>
<path d="M80,30 l14,14 -14,14 -14,-14 Z M300,90 l14,14 -14,14 -14,-14 Z M560,30 l14,14 -14,14 -14,-14 Z M820,90 l14,14 -14,14 -14,-14 Z M1060,30 l14,14 -14,14 -14,-14 Z"/>
</g>
<rect x="880" y="26" width="90" height="150" fill="#7e97b4" opacity="0.5">
<animate attributeName="opacity" values="0.35;0.6;0.35" dur="16s" repeatCount="indefinite"/>
</rect>
<g stroke="#3a2c1c" stroke-width="5"><line x1="888" y1="40" x2="962" y2="40"/><line x1="888" y1="76" x2="962" y2="76"/><line x1="888" y1="112" x2="962" y2="112"/><line x1="888" y1="148" x2="962" y2="148"/></g>
<!-- fadista in profile, shawl hem swaying a fraction -->
<g>
<polygon points="520,300 566,300 556,150 530,150" fill="#191624"/>
<polygon points="530,148 566,152 544,232" fill="#6e1e28">
<animateTransform attributeName="transform" type="rotate" values="0 544 232; 1.2 544 232; 0 544 232" dur="7s" repeatCount="indefinite"/>
</polygon>
<circle cx="552" cy="122" r="17" fill="#eecfa6"/>
<ellipse cx="546" cy="112" rx="11" ry="9" fill="#100c0c"/>
<ellipse cx="566" cy="130" rx="4.5" ry="3.4" fill="#0d0909"/>
</g>
<!-- seated guitarist, right hand strumming in a short stroke -->
<g>
<circle cx="648" cy="140" r="15" fill="#e8c49c"/>
<polygon points="622,158 668,158 676,238 616,238" fill="#23202f"/>
<ellipse cx="686" cy="196" rx="42" ry="34" fill="#1e2150" stroke="#c49e4a" stroke-width="2"/>
<ellipse cx="672" cy="172" rx="27" ry="22" fill="#1e2150" stroke="#c49e4a" stroke-width="2"/>
<circle cx="682" cy="190" r="9" fill="#08081a"/>
<line x1="706" y1="176" x2="742" y2="140" stroke="#463018" stroke-width="7"/>
<g stroke="#e8c49c" stroke-width="7">
<line x1="668" y1="182" x2="700" y2="196">
<animateTransform attributeName="transform" type="rotate" values="0 668 182; 7 668 182; 0 668 182" dur="2.6s" repeatCount="indefinite"/>
</line>
</g>
</g>
<!-- tables, upturned glasses, trembling candle flames -->
<g>
<ellipse cx="220" cy="272" rx="86" ry="14" fill="#4a3018"/>
<ellipse cx="980" cy="278" rx="96" ry="15" fill="#4a3018"/>
<polygon points="196,258 216,258 210,274 202,274" fill="none" stroke="#aebfd0" stroke-width="2"/>
<polygon points="950,262 970,262 964,278 956,278" fill="none" stroke="#aebfd0" stroke-width="2"/>
<rect x="300" y="252" width="16" height="11" fill="#55565e"/>
<polygon points="308,238 303,252 313,252" fill="#ffbe5a">
<animateTransform attributeName="transform" type="skewX" values="0; 2.5; -2; 0" dur="1.8s" repeatCount="indefinite"/>
</polygon>
<rect x="1052" y="258" width="16" height="11" fill="#55565e"/>
<polygon points="1060,244 1055,258 1065,258" fill="#ffbe5a">
<animateTransform attributeName="transform" type="skewX" values="0; -2; 2.5; 0" dur="2.1s" repeatCount="indefinite"/>
</polygon>
</g>
<!-- the printed story sheet sliding into view with each full strumming cycle -->
<g>
<rect x="356" y="288" width="150" height="34" fill="#ece4d0" transform="rotate(-2 356 288)">
<animateTransform attributeName="transform" type="translate" values="0,10; 0,10; 26,0; 26,0" keyTimes="0; 0.45; 0.6; 1" dur="10.4s" repeatCount="indefinite" additive="sum"/>
</rect>
<g stroke="#8a7a5c" stroke-width="2"><line x1="368" y1="298" x2="486" y2="294"/><line x1="368" y1="308" x2="470" y2="304"/></g>
</g>
<rect y="318" width="1200" height="22" fill="#332412"/>
</svg>
